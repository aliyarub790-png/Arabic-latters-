name: Build Arabic Letters Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract game ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p game
          unzip -o "$ZIP_FILE" -d game

      - name: Find HTML file
        shell: bash
        run: |
          set -e

          HTML_FILE=$(find game -type f -name "index.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "Found HTML: $HTML_FILE"

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-app

          mkdir -p android-app/app/src/main/java/com/arabicletters/game
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/values

          cp "$HTML_FILE" android-app/app/src/main/assets/index.html

          cat > android-app/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ArabicLettersGame"
include(":app")
EOF

          cat > android-app/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > android-app/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arabicletters.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arabicletters.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
}
EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">Arabic Letters Game</string>
</resources>
EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="true"
        android:label="@string/app_name"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:windowFullscreen">true</item>
        <item name="android:colorAccent">#6750A4</item>
    </style>
</resources>
EOF

          cat > android-app/app/src/main/java/com/arabicletters/game/MainActivity.java <<'EOF'
package com.arabicletters.game;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        WebView.setWebContentsDebuggingEnabled(false);

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
        settings.setMediaPlaybackRequiresUserGesture(false);

        webView.setWebViewClient(new WebViewClient());

        webView.loadUrl("file:///android_asset/index.html");

        setContentView(webView);
    }

    @Override
    public void onBackPressed() {
        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOF

          cd android-app

          gradle wrapper --gradle-version 8.9

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd android-app

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find android-app/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-letters-game-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

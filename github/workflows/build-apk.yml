name: Build Arabic Letters Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find game ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "./arabic-letters-game-app.zip" ]; then
            ZIP_FILE="./arabic-letters-game-app.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*' | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Game ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract game
        shell: bash
        run: |
          set -e

          rm -rf extracted-game
          mkdir -p extracted-game

          unzip -q "$ZIP_FILE" -d extracted-game

          INDEX_FILE="$(find extracted-game -type f -name 'index.html' | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found inside the game ZIP."
            exit 1
          fi

          GAME_DIR="$(dirname "$INDEX_FILE")"
          echo "Game directory: $GAME_DIR"
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-app

          mkdir -p android-app
          mkdir -p android-app/app/src/main/java/com/yarub/arabicletters
          mkdir -p android-app/app/src/main/assets/game
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

          cp -a "$GAME_DIR"/. android-app/app/src/main/assets/game/

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ArabicLettersGame"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.yarub.arabicletters'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.yarub.arabicletters'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Arabic Letters Game"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/java/com/yarub/arabicletters/MainActivity.java <<'EOF'
          package com.yarub.arabicletters;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/game/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-app
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-Letters-Game-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

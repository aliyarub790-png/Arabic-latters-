name: Build Arabic Letters Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find game ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Game ZIP file was not found."
            exit 1
          fi

          echo "Game ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract game
        shell: bash
        run: |
          set -e

          rm -rf game
          mkdir -p game

          unzip -o "$ZIP_FILE" -d game

          echo "Files inside game:"
          find game -maxdepth 3 -type f -print

      - name: Check index.html
        shell: bash
        run: |
          set -e

          HTML_FILE=$(find game -type f -name "index.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found inside the ZIP."
            exit 1
          fi

          echo "index.html found:"
          echo "$HTML_FILE"

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-app

          mkdir -p android-app/app/src/main/java/com/arabicletters/game
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/values

          cp "$HTML_FILE" android-app/app/src/main/assets/index.html

          cat > android-app/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ArabicLettersGame"
include(":app")
EOF

          cat > android-app/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > android-app/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arabicletters.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arabicletters.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">Arabic Letters Game</string>
</resources>
EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:windowFullscreen">true</item>
        <

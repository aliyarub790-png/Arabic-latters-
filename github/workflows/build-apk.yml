name: Build Arabic Letters Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Get source code
        uses: actions/checkout@v4

      - name: Check game file
        run: |
          set -e

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html is missing."
            exit 1
          fi

          echo "Game found:"
          ls -lh index.html

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android application
        run: |
          cordova create arabic-game \
            com.yarubacademy.arabicletters \
            "تعلم الحروف العربية"

      - name: Put game inside application
        run: |
          set -e

          rm -rf arabic-game/www/*

          cp index.html arabic-game/www/index.html

          echo "Game copied successfully."

      - name: Add Android
        working-directory: arabic-game
        run: |
          cordova platform add android

      - name: Build APK
        working-directory: arabic-game
        run: |
          cordova build android --debug

      - name: Find APK
        id: apk
        run: |
          set -e

          APK=$(find arabic-game -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          ls -lh "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-letters-game
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
